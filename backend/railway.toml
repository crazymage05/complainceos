[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[cron]]
schedule = "0 2 * * *"
command = "python reset_obligations.py"

[[cron]]
schedule = "0 6 * * *"
command = "python fetch_circulars.py"
